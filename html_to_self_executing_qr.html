<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HTML → Self-Executing QR</title>
<style>
body{font-family:system-ui,sans-serif;max-width:900px;margin:0 auto;padding:24px;line-height:1.45}
textarea{width:100%;height:150px;box-sizing:border-box;font-family:monospace}
#qr{margin:20px 0;display:flex;justify-content:center}
button{padding:10px 16px;margin:5px 5px 5px 0;cursor:pointer}
#status{white-space:pre-wrap}
.card{border:1px solid #ccc;border-radius:10px;padding:16px;margin:16px 0}
small{color:#555}
</style>
</head>
<body>
<h1>HTML → Self-Executing QR</h1>
<p>Choose an HTML file. This tool compresses it and creates a QR code containing a <code>data:</code> URL. Scanning the QR should open and run the page in a browser.</p>

<div class="card">
<input id="file" type="file" accept=".html,.htm,text/html">
<div id="status">No file selected.</div>
</div>

<div id="qr"></div>
<button id="download" disabled>Download QR PNG</button>
<button id="copy" disabled>Copy QR URL</button>
<div id="details"></div>

<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
<script>
const fileInput=document.getElementById('file');
const qr=document.getElementById('qr');
const status=document.getElementById('status');
const details=document.getElementById('details');
const download=document.getElementById('download');
const copy=document.getElementById('copy');
let currentURL='';

function bytesToBase64Url(bytes){
  let s='';
  const chunk=0x8000;
  for(let i=0;i<bytes.length;i+=chunk){
    s+=String.fromCharCode(...bytes.subarray(i,i+chunk));
  }
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}

fileInput.addEventListener('change',async()=>{
  const file=fileInput.files[0];
  if(!file)return;
  status.textContent='Reading and compressing…';
  qr.innerHTML='';
  details.innerHTML='';
  download.disabled=true; copy.disabled=true;
  try{
    const html=await file.text();
    const raw=new TextEncoder().encode(html);
    const compressed=pako.gzip(raw,{level:9});
    const payload=bytesToBase64Url(compressed);

    // The decoder is embedded in the data URL itself.
    // It uses browser DecompressionStream when available.
    // The payload is URL-safe Base64.
    const bootstrap=`<!doctype html><meta charset="utf-8"><script>
(async()=>{const b64=location.hash.slice(1),s=atob(b64.replace(/-/g,'+').replace(/_/g,'/')),a=Uint8Array.from(s,c=>c.charCodeAt(0));const out=new Uint8Array(await new Response(new Blob([a]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());document.open();document.write(new TextDecoder().decode(out));document.close()})().catch(e=>document.body.textContent='QR page could not be decompressed: '+e)
<\/script>`;

    // Put bootstrap in the data URL and compressed page in the fragment.
    // Fragments are not sent to a server.
    currentURL='data:text/html;charset=utf-8,'+
      encodeURIComponent(bootstrap)+'#'+payload;

    const canvas=document.createElement('canvas');
    await QRCode.toCanvas(canvas,currentURL,{
      errorCorrectionLevel:'L',
      margin:2,
      width:800
    });
    qr.appendChild(canvas);

    const rawKB=(raw.length/1024).toFixed(2);
    const compressedKB=(compressed.length/1024).toFixed(2);
    const urlKB=(currentURL.length/1024).toFixed(2);

    status.textContent='QR generated.';
    details.innerHTML=`<p><b>Original:</b> ${raw.length.toLocaleString()} bytes (${rawKB} KB)<br>
      <b>Gzip:</b> ${compressed.length.toLocaleString()} bytes (${compressedKB} KB)<br>
      <b>Data URL:</b> ${currentURL.length.toLocaleString()} characters (${urlKB} KB)</p>
      <small>QR codes have limited capacity. If the QR is too dense for reliable scanning, the HTML is too large for this single-QR approach.</small>`;

    download.disabled=false; copy.disabled=false;
    download.onclick=()=>{
      const a=document.createElement('a');
      a.download='html-qr.png';
      a.href=canvas.toDataURL('image/png');
      a.click();
    };
    copy.onclick=async()=>{
      await navigator.clipboard.writeText(currentURL);
      copy.textContent='Copied!';
      setTimeout(()=>copy.textContent='Copy QR URL',1200);
    };
  }catch(e){
    status.textContent='Error: '+e.message;
  }
});
</script>
</body>
</html>
